name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev, "feature/**" ]
  pull_request:
    branches: [ main, dev ]

jobs:
  lint-and-compile:
    name: Lint & Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install flake8

      - name: Lint with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Compile Python Files
        run: |
          python -m py_compile yt_terminal/*.py yt_terminal/widgets/*.py

  build-executable:
    name: Build Standalone Executable
    needs: lint-and-compile
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Build Standalone Binary with PyInstaller
        run: |
          pyinstaller --name "YT-Terminal" \
            --onefile \
            --console \
            --clean \
            --collect-data ytmusicapi \
            --add-data "yt_terminal/style.tcss:." \
            --add-data "yt_terminal/assets:assets" \
            yt_terminal/main.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yt-terminal-binary-${{ matrix.os }}
          path: dist/
